name: Portfolio CI pipeline

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: build docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }} .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest .

      - name: login to docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: list docker images
        run: docker images

      - name: push docker image to registry
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: ssh to Linux and run container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTS }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin
            docker rm -f my-portfolio-app || echo "Container not found, skipping removal"
            docker rmi -f ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest || echo "Image does not exist"
            docker run -d --name my-portfolio-app -p 80:80 ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest