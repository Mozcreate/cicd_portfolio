name: Portfolio CICD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }} .

      - name: Tag image as latest
        run: |
          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }} \
            ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest

      - name: List Docker images
        run: docker images

      - name: Push versioned image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }}

      - name: Push latest image
        run: |
          docker push \
            ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: SSH to Linux server and deploy container
        uses: appleboy/ssh-action@v1.8.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            echo "Stopping existing container..."

            docker rm -f my-portfolio-app || true

            echo "Pulling new Docker image..."

            docker pull ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }}

            echo "Starting new container..."

            docker run -d \
              --name my-portfolio-app \
              -p 8080:80 \
              --restart unless-stopped \
              ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }}

            echo "Deployment complete."

            docker ps