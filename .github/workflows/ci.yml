name: Portfolio CICD Pipeline

on:
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }} .

          docker tag \
            ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }} \
            ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: List Docker images
        run: docker images

      - name: Push Docker image to Docker Hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:${{ github.run_number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest


  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: SSH to Linux and run container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            docker login -u "${{ secrets.DOCKER_USERNAME }}" -p "${{ secrets.DOCKER_PASSWORD }}"

            docker pull ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest

            docker rm -f my-portfolio-app || true

            docker run -d \
              --name my-portfolio-app \
              -p 8080:80 \
              ${{ secrets.DOCKER_USERNAME }}/my-portfolio-app:latest

            docker ps